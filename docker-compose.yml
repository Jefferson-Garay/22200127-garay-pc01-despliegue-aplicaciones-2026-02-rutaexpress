name: rutaexpress-pc01

x-app-environment: &app-environment
  DB_HOST: db
  DB_PORT: "5432"
  DB_USER: ${DB_USER:?Define DB_USER en .env}
  DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
  DB_NAME: ${DB_NAME:?Define DB_NAME en .env}
  ENABLE_TEST_DELAY: ${ENABLE_TEST_DELAY:-false}

x-app: &app
  image: ${APP_IMAGE:-envios-app:1.0.0}
  build: .
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy

services:
  app1:
    <<: *app
    environment:
      <<: *app-environment
      INSTANCE_ID: app1

  app2:
    <<: *app
    environment:
      <<: *app-environment
      INSTANCE_ID: app2

  app3:
    <<: *app
    environment:
      <<: *app-environment
      INSTANCE_ID: app3

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:?Define DB_USER en .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
      POSTGRES_DB: ${DB_NAME:?Define DB_NAME en .env}
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 3s
      timeout: 3s
      retries: 20

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx_logs:/var/log/rutaexpress
    depends_on:
      - app1
      - app2
      - app3

volumes:
  db_data:
  nginx_logs: