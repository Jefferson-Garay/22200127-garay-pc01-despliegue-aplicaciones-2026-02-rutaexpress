# Aplicar el límite únicamente a POST /envios.
map "$request_method:$uri" $envios_limit_key {
    default "";
    "POST:/envios" $binary_remote_addr;
}

limit_req_zone $envios_limit_key zone=envios_por_ip:10m rate=2r/s;

# Identificador para relacionar solicitudes con los registros.
map $http_x_request_id $trace_id {
    default $request_id;
    "~^[a-fA-F0-9-]{36}$" $http_x_request_id;
}

log_format rutaexpress escape=json
    '{"fecha":"$time_iso8601",'
    '"timestamp":"$msec",'
    '"ip":"$remote_addr",'
    '"request_id":"$trace_id",'
    '"backend_request_id":"$upstream_http_x_request_id",'
    '"clave_operacion":"$http_idempotency_key",'
    '"metodo":"$request_method",'
    '"ruta":"$uri",'
    '"estado":"$status",'
    '"instancia":"$upstream_http_x_instance_id",'
    '"upstream":"$upstream_addr",'
    '"upstream_estado":"$upstream_status",'
    '"duracion":"$request_time",'
    '"limite":"$limit_req_status"}';

upstream aplicaciones {
    zone aplicaciones 64k;

    server app1:3000 max_fails=1 fail_timeout=2s;
    server app2:3000 max_fails=1 fail_timeout=2s;
    server app3:3000 max_fails=1 fail_timeout=2s;
}

server {
    listen 80;
    server_name _;

    access_log /var/log/rutaexpress/access.jsonl rutaexpress;
    error_log /var/log/rutaexpress/error.log warn;

    client_max_body_size 16k;

    location / {
        limit_req zone=envios_por_ip burst=4 nodelay;
        limit_req_status 429;

        proxy_pass http://aplicaciones;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $trace_id;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";

        proxy_connect_timeout 1s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;

        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
    }
}